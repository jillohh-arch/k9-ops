name: Release Production

# Production Web releases are MANUAL ONLY.
#
# Merging to master no longer publishes to production. A release must be
# dispatched explicitly with a commit SHA that is already integrated in
# master, and it must pass the `production` Environment approval gate.
#
# Two modes, and the SAFE one is the default:
#   auth-check (default) authenticates via WIF and runs read-only checks only.
#                        The deploy step is structurally ineligible.
#   release              performs the real Hosting release after every gate.
#
# Blast radius of a `release` run (contract):
#   MAY change:  Firebase Hosting site `canil-gcm`
#                `ssrcanilgcm` (Next.js frameworks backend)
#   MUST NOT change: adminPatchK9Identity, any other backend Function,
#                Firestore Rules, Firestore indexes, Firestore data, Auth
#
# External configuration is provisioned separately (E9-WG-B2) and MUST exist
# before the first dispatch:
#   - GitHub Environment `production` (required reviewer, branch policy master)
#   - Environment variables: the 8 NEXT_PUBLIC_FIREBASE_* entries below
#   - Environment variables: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA already integrated in master"
        required: true
        type: string
      mode:
        description: "auth-check = authenticate and run read-only checks only (no deploy). release = publish to production."
        required: true
        type: choice
        default: auth-check
        options:
          - auth-check
          - release

# Never run two production releases at once, and never cancel one in flight:
# aborting mid-deploy can leave Hosting and the SSR backend out of sync.
concurrency:
  group: production-hosting
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Assert SHA exists and is integrated in master
        run: |
          set -euo pipefail
          SHA='${{ inputs.sha }}'
          echo "Requested mode:        ${{ inputs.mode }}"
          echo "Requested release SHA: ${SHA}"
          git fetch --no-tags origin master
          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "::error::SHA ${SHA} does not exist in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${SHA}" origin/master; then
            echo "::error::SHA ${SHA} is not an ancestor of origin/master. Only integrated commits may be released."
            exit 1
          fi
          echo "Resolved commit: $(git rev-parse "${SHA}")"
          echo "origin/master:   $(git rev-parse origin/master)"
          echo "SHA is integrated in master."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION: ${{ vars.NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION }}

  release:
    name: ${{ inputs.mode == 'release' && 'Release to production' || 'Auth check (read-only)' }}
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://canil-gcm.web.app
    steps:
      - name: Checkout requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # ---- read-only proofs: run in BOTH modes, before any mutation ----

      - name: Verify Firebase CLI resolves
        run: |
          set -euo pipefail
          VERSION="$(npx --no-install firebase --version)"
          echo "firebase-tools version: ${VERSION}"
          if [ "${VERSION}" != "15.25.1" ]; then
            echo "::error::Expected pinned firebase-tools 15.25.1, got ${VERSION}."
            exit 1
          fi

      - name: Verify credential reaches Firebase (read-only)
        run: |
          set -euo pipefail
          # Read-only inventory call. Proves OIDC -> WIF -> GCP -> firebase-tools.
          npx --no-install firebase projects:list --json > projects.json
          if ! python3 - <<'PY'
          import json, sys
          data = json.load(open("projects.json", encoding="utf-8"))
          result = data.get("result", [])
          ids = {p.get("projectId") for p in result}
          print("visible projects: %d" % len(ids))
          if "canil-gcm" not in ids:
              print("::error::canil-gcm not visible to the deploy credential.")
              sys.exit(1)
          print("canil-gcm is visible to the deploy credential.")
          PY
          then
            exit 1
          fi
          rm -f projects.json

      - name: Verify Hosting target is readable (read-only)
        run: |
          set -euo pipefail
          # Read-only Hosting inspection. Never clones, deploys, or releases.
          npx --no-install firebase hosting:sites:list \
            --project canil-gcm --json > sites.json
          if ! python3 - <<'PY'
          import json, sys
          data = json.load(open("sites.json", encoding="utf-8"))
          sites = data.get("result", {}).get("sites", [])
          names = {s.get("name", "").rsplit("/", 1)[-1] for s in sites}
          print("hosting sites: %s" % sorted(names))
          if "canil-gcm" not in names:
              print("::error::Hosting site canil-gcm not readable.")
              sys.exit(1)
          print("Hosting site canil-gcm is readable.")
          PY
          then
            exit 1
          fi
          rm -f sites.json

      # ---- mutation: gated hard on mode == release ----

      - name: Write Firebase Web config
        if: ${{ inputs.mode == 'release' }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "NEXT_PUBLIC_APP_ENV=production"
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}"
            echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}"
            echo "NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION=${{ vars.NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION }}"
          } > .env.local

      - name: Deploy Hosting
        if: ${{ inputs.mode == 'release' }}
        run: |
          npx --no-install firebase deploy \
            --only hosting \
            --project canil-gcm \
            --non-interactive

      - name: Record provenance
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Production Web ${{ inputs.mode }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mode | \`${{ inputs.mode }}\` |"
            echo "| Requested SHA | \`${{ inputs.sha }}\` |"
            echo "| Resolved SHA | \`$(git rev-parse HEAD)\` |"
            echo "| Firebase project | \`canil-gcm\` |"
            echo "| Hosting site | \`canil-gcm\` |"
            echo "| Frameworks backend | \`ssrcanilgcm\` (southamerica-east1) |"
            echo "| Workflow run | \`${{ github.run_id }}\` (attempt ${{ github.run_attempt }}) |"
            echo "| Dispatched by | \`${{ github.actor }}\` |"
            echo "| Timestamp (UTC) | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |"
            echo
            if [ "${{ inputs.mode }}" = "release" ]; then
              echo "PRODUCTION MUTATION = YES (Hosting + ssrcanilgcm)"
              echo "DEPLOY STEP = EXECUTED"
            else
              echo "PRODUCTION MUTATION = NO"
              echo "DEPLOY STEP = SKIPPED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
